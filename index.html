<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 Race Intelligence Centre</title>

https://cdn.jsdelivr.net/npm/chart.jsscript>

<style>

:root{
    --red:#e10600;
    --card:#1a1a1a;
    --bg:#0b0b0b;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:var(--bg);
    color:white;
    padding:25px;
}

h1{
    color:var(--red);
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(400px,1fr));
    gap:20px;
}

.card{
    background:var(--card);
    border-radius:15px;
    padding:20px;
    box-shadow:0 0 20px rgba(0,0,0,.5);
}

h2{
    margin-bottom:15px;
    color:var(--red);
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:var(--red);
    padding:10px;
}

td{
    padding:8px;
    border-bottom:1px solid #333;
}

.countdown{
    font-size:2rem;
    margin-top:10px;
}

select{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    border:none;
    border-radius:8px;
}

.compare-result{
    margin-top:15px;
    line-height:1.8;
}

.team-redbull{
    color:#4ea1ff;
}

.team-ferrari{
    color:#ff3c3c;
}

.team-mercedes{
    color:#00d2be;
}

.team-mclaren{
    color:#ff8700;
}

canvas{
    max-height:400px;
}

</style>
</head>

<body>

<h1>🏎 F1 Race Intelligence Centre</h1>

<div class="grid">

<div class="card">
<h2>Next Race</h2>
<div id="raceName">Loading...</div>
<div class="countdown" id="countdown"></div>
</div>

<div class="card">
<h2>Driver Championship</h2>
<div id="standings"></div>
</div>

<div class="card">
<h2>Constructor Championship</h2>
<div id="constructors"></div>
</div>

<div class="card">
<h2>Driver Comparison</h2>

<select id="driver1"></select>
<select id="driver2"></select>

<div class="compare-result" id="compareResult"></div>
</div>

<div class="card">
<h2>Championship Visualisation</h2>
<canvas id="pointsChart"></canvas>
</div>

</div>

<script>

let driversData=[];

async function getDrivers(){

const response = await fetch(
"https://api.jolpi.ca/ergast/f1/current/driverStandings.json"
);

const data = await response.json();

const standings =
data.MRData.StandingsTable.StandingsLists[0].DriverStandings;

driversData = standings;

renderDrivers(standings);
buildChart(standings);
buildSelectors(standings);

}

function renderDrivers(list){

let html = `
<table>
<tr>
<th>#</th>
<th>Driver</th>
<th>Team</th>
<th>Points</th>
</tr>
`;

list.forEach(d=>{

html += `
<tr>
<td>${d.position}</td>
<td>${d.Driver.givenName} ${d.Driver.familyName}</td>
<td>${d.Constructors[0].name}</td>
<td>${d.points}</td>
</tr>
`;

});

html += "</table>";

document.getElementById("standings").innerHTML = html;
}

async function getConstructors(){

const response = await fetch(
"https://api.jolpi.ca/ergast/f1/current/constructorStandings.json"
);

const data = await response.json();

const standings =
data.MRData.StandingsTable.StandingsLists[0]
.ConstructorStandings;

let html = `
<table>
<tr>
<th>#</th>
<th>Team</th>
<th>Points</th>
</tr>
`;

standings.forEach(team=>{

html += `
<tr>
<td>${team.position}</td>
<td>${team.Constructor.name}</td>
<td>${team.points}</td>
</tr>
`;

});

html += "</table>";

document.getElementById("constructors").innerHTML = html;

}

async function getNextRace(){

const response = await fetch(
"https://api.jolpi.ca/ergast/f1/current/next.json"
);

const data = await response.json();

const race =
data.MRData.RaceTable.Races[0];

document.getElementById("raceName").innerHTML=
`
<h3>${race.raceName}</h3>
<p>${race.Circuit.circuitName}</p>
`;

startCountdown(race.date);

}

function startCountdown(dateString){

const target = new Date(dateString);

function update(){

const now = new Date();

const diff = target-now;

const days =
Math.floor(diff/(1000*60*60*24));

const hours =
Math.floor(diff/(1000*60*60)%24);

const mins =
Math.floor(diff/(1000*60)%60);

document.getElementById("countdown")
.innerText =
`${days}d ${hours}h ${mins}m`;

}

update();

setInterval(update,60000);

}

function buildChart(drivers){

const ctx =
document
.getElementById("pointsChart")
.getContext("2d");

new Chart(ctx,{

type:"bar",

data:{

labels:drivers.map(
d=>d.Driver.familyName
),

datasets:[{

label:"Points",

data:drivers.map(
d=>Number(d.points)
),

backgroundColor:"#e10600"

}]

}

});

}

function buildSelectors(drivers){

const d1 =
document.getElementById("driver1");

const d2 =
document.getElementById("driver2");

drivers.forEach(driver=>{

const name =
driver.Driver.givenName +
" " +
driver.Driver.familyName;

d1.innerHTML +=
`<option>${name}</option>`;

d2.innerHTML +=
`<option>${name}</option>`;

});

d1.addEventListener(
"change",
compare
);

d2.addEventListener(
"change",
compare
);

compare();

}

function compare(){

const a =
document.getElementById("driver1").value;

const b =
document.getElementById("driver2").value;

if(!a || !b) return;

const d1 =
driversData.find(
d=>
(d.Driver.givenName+" "+
d.Driver.familyName)
===a
);

const d2 =
driversData.find(
d=>
(d.Driver.givenName+" "+
d.Driver.familyName)
===b
);

document.getElementById(
"compareResult"
).innerHTML =

`
<b>${a}</b><br>
Position: ${d1.position}<br>
Points: ${d1.points}<br>
Wins: ${d1.wins}

<hr style="margin:10px 0;">

<b>${b}</b><br>
Position: ${d2.position}<br>
Points: ${d2.points}<br>
Wins: ${d2.wins}
`;

}

getDrivers();
getConstructors();
getNextRace();

</script>

</body>
</html>
