<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 Dashboard</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#111;
    color:white;
    padding:30px;
}

h1{
    color:#e10600;
    margin-bottom:20px;
}

.card{
    background:#1c1c1c;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
    box-shadow:0 0 10px rgba(0,0,0,0.4);
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#e10600;
    padding:10px;
    text-align:left;
}

td{
    padding:10px;
    border-bottom:1px solid #333;
}

.loading{
    color:#888;
}
</style>
</head>
<body>

<h1>🏎 Formula 1 Dashboard</h1>

<div class="card">
    <h2>Next Race</h2>
    <div id="nextRace" class="loading">Loading...</div>
</div>

<div class="card">
    <h2>Driver Championship</h2>
    <div id="drivers" class="loading">Loading...</div>
</div>

<div class="card">
    <h2>Constructor Championship</h2>
    <div id="constructors" class="loading">Loading...</div>
</div>

<script>

async function loadNextRace(){

    const res = await fetch(
        "https://api.jolpi.ca/ergast/f1/current/next.json"
    );

    const data = await res.json();

    const race = data.MRData.RaceTable.Races[0];

    document.getElementById("nextRace").innerHTML = `
        <h3>${race.raceName}</h3>
        <p>${race.Circuit.circuitName}</p>
        <p>${race.date}</p>
        <p>${race.Circuit.Location.locality}, ${race.Circuit.Location.country}</p>
    `;
}

async function loadDrivers(){

    const res = await fetch(
        "https://api.jolpi.ca/ergast/f1/current/driverStandings.json"
    );

    const data = await res.json();

    const standings =
        data.MRData.StandingsTable.StandingsLists[0].DriverStandings;

    let html = `
    <table>
        <tr>
            <th>Pos</th>
            <th>Driver</th>
            <th>Team</th>
            <th>Pts</th>
        </tr>
    `;

    standings.forEach(driver=>{

        html += `
        <tr>
            <td>${driver.position}</td>
            <td>${driver.Driver.givenName} ${driver.Driver.familyName}</td>
            <td>${driver.Constructors[0].name}</td>
            <td>${driver.points}</td>
        </tr>
        `;
    });

    html += "</table>";

    document.getElementById("drivers").innerHTML = html;
}

async function loadConstructors(){

    const res = await fetch(
        "https://api.jolpi.ca/ergast/f1/current/constructorStandings.json"
    );

    const data = await res.json();

    const standings =
        data.MRData.StandingsTable.StandingsLists[0].ConstructorStandings;

    let html = `
    <table>
        <tr>
            <th>Pos</th>
            <th>Team</th>
            <th>Pts</th>
        </tr>
    `;

    standings.forEach(team=>{

        html += `
        <tr>
            <td>${team.position}</td>
            <td>${team.Constructor.name}</td>
            <td>${team.points}</td>
        </tr>
        `;
    });

    html += "</table>";

    document.getElementById("constructors").innerHTML = html;
}

loadNextRace();
loadDrivers();
loadConstructors();

</script>

</body>
</html>
